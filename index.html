<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADSA Friend Recommender (Python)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 30px 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    
    header { margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    h1 { font-size: 1.5rem; color: var(--accent); }
    p.subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

    .control-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 25px;
    }
    label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 5px; }
    select, input {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px;
      border-radius: 4px;
      outline: none;
    }
    button {
      background: var(--accent);
      color: #0b1120;
      border: none;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 4px;
      cursor: pointer;
      align-self: flex-end;
    }
    button:hover { opacity: 0.9; }

    .grid-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
    .section-title { font-size: 1rem; margin-bottom: 12px; border-left: 3px solid var(--accent); padding-left: 8px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 0.7rem;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-weight: bold;
    }
    .mutual-tag {
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-right: 4px;
      display: inline-block;
      margin-top: 4px;
    }
    @media (max-width: 600px) { .grid-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Social Network Friend Recommender</h1>
    <p class="subtitle">Python Backend: Hash Map (Adjacency List) + BFS Traversal + Min-Heap (Top-K)</p>
  </header>

  <div class="control-panel">
    <div>
      <label>Target User</label>
      <select id="userSelect"></select>
    </div>
    <div>
      <label>BFS Max Distance</label>
      <select id="depthSelect">
        <option value="2">2 Hops (Friends of Friends)</option>
        <option value="3">3 Hops</option>
      </select>
    </div>
    <div>
      <label>Top K Recommendations</label>
      <input type="number" id="topKInput" value="3" min="1" max="10">
    </div>
    <button onclick="fetchRecommendations()">Run Algorithm</button>
  </div>

  <div class="grid-layout">
    <div>
      <h2 class="section-title">Direct Friends (Distance = 1)</h2>
      <div id="directFriendsContainer"></div>
    </div>
    <div>
      <h2 class="section-title">Ranked Recommendations (Min-Heap Top-K)</h2>
      <div id="recommendationsContainer"></div>
    </div>
  </div>
</div>

<script>
  async function loadUsers() {
    const res = await fetch('/api/users');
    const users = await res.json();
    const select = document.getElementById('userSelect');
    users.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = `${u.name} (${u.department})`;
      select.appendChild(opt);
    });
    fetchRecommendations();
  }

  async function fetchRecommendations() {
    const userId = document.getElementById('userSelect').value || 1;
    const depth = document.getElementById('depthSelect').value;
    const topK = document.getElementById('topKInput').value;

    const res = await fetch(`/api/recommend?user_id=${userId}&depth=${depth}&top_k=${topK}`);
    const data = await res.json();

    const friendsBox = document.getElementById('directFriendsContainer');
    friendsBox.innerHTML = '';
    if (data.direct_friends.length === 0) {
      friendsBox.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;">No direct friends.</p>';
    } else {
      data.direct_friends.forEach(f => {
        friendsBox.innerHTML += `
          <div class="card">
            <strong>${f.name}</strong>
            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;">Distance: 1 (Direct)</div>
          </div>`;
      });
    }

    const recBox = document.getElementById('recommendationsContainer');
    recBox.innerHTML = '';
    if (data.recommendations.length === 0) {
      recBox.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem;">No mutual friend recommendations found within this depth.</p>';
    } else {
      data.recommendations.forEach(r => {
        const mutualListHtml = r.mutual_friends.map(m => `<span class="mutual-tag">${m}</span>`).join('');
        recBox.innerHTML += `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong>${r.name}</strong>
              <span class="badge">${r.mutual_count} Mutual Friend${r.mutual_count > 1 ? 's' : ''}</span>
            </div>
            <div style="font-size:0.75rem; color:var(--text-muted); margin:4px 0;">
              ${r.department} &bull; BFS Distance: ${r.distance} hops
            </div>
            <div style="margin-top:8px;">
              <div style="font-size:0.7rem; color:var(--text-muted);">Connected through:</div>
              ${mutualListHtml}
            </div>
          </div>`;
      });
    }
  }

  window.onload = loadUsers;
</script>
</body>
</html>
